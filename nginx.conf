# Site config for Alpine nginx (/etc/nginx/nginx.conf loads modules from /etc/nginx/modules
# and includes this file). The build precompresses assets, so brotli_static / gzip_static
# just pick the .br or .gz twin; on-the-fly compression only covers what has no twin.
server {
    listen 80;
    root /var/www/emul;
    index index.html;

    brotli_static on;
    brotli on;
    brotli_comp_level 6;
    brotli_types text/css application/javascript application/json image/svg+xml application/octet-stream;

    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream;

    # Hashed build assets never change; config.json and index.html must always be re-checked.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location = /config.json {
        add_header Cache-Control "no-cache";
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
