load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_static_module.so;

worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  charset utf-8;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /dev/stdout main;

  sendfile on;
  keepalive_timeout 65;

  brotli_static on;
  brotli on;
  brotli_comp_level 6;
  brotli_types text/plain text/css application/javascript application/json image/svg+xml application/octet-stream;

  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 256;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/octet-stream;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    location = /config.json {
      alias /etc/config/config.json;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
    }

    location /assets/ {
      try_files $uri =404;
      expires 1y;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, immutable";
      access_log off;
    }

    # The editor's symbol index: 5 MB of JSON per chip, brotli'd at build time, a day in the cache.
    location /symbols/ {
      try_files $uri =404;
      expires 1d;
      include /etc/nginx/security-headers.conf;
      access_log off;
    }

    # The debugger's copies of ST's HAL/CMSIS and the build service's startup files, fetched as
    # the debugger steps into them, and the peripheral register maps: a day in the cache. A file
    # that is not there is a 404, never the app.
    location /st/ {
      try_files $uri =404;
      default_type text/plain;
      expires 1d;
      include /etc/nginx/security-headers.conf;
      access_log off;
    }
    location /peripherals/ {
      try_files $uri =404;
      expires 1d;
      include /etc/nginx/security-headers.conf;
      access_log off;
    }

    location ~* \.(?:elf|svg|png|ico|woff2?)$ {
      try_files $uri =404;
      expires 1d;
      include /etc/nginx/security-headers.conf;
      access_log off;
    }

    location / {
      try_files $uri /index.html;
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
    }
  }
}
