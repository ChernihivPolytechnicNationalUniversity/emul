    <!--
      Boot splash: visible before the bundle has parsed, so its CSS is inline. The loop is
      rendered white-on-black (source: ../emul-loader, Remotion) and composited — invert +
      multiply on light, screen on dark — so the plate vanishes on any background without an
      alpha channel (Safari can't do VP9 alpha). Delayed 150 ms so a warm load never flashes it.
      The build inlines the WebM as a data: URI (vite.config.ts, inlineBootLoader), so the splash
      needs no request at all and plays before the bundle has even started downloading.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        background: #fff;
        opacity: 0;
        animation: boot-in 240ms cubic-bezier(0.16, 1, 0.3, 1) 150ms forwards;
        pointer-events: none;
      }
      #boot video { width: 96px; height: 96px; }
      #boot svg { width: 48px; height: 48px; color: oklch(0.145 0 0); }
      #boot video { filter: invert(1); mix-blend-mode: multiply; }
      #boot svg { display: none; opacity: 0.85; }
      .dark #boot { background: oklch(0.145 0 0); }
      .dark #boot video { filter: none; mix-blend-mode: screen; }
      .dark #boot svg { color: oklch(0.985 0 0); }
      @media (prefers-reduced-motion: reduce) {
        #boot { animation-duration: 1ms; }
        #boot video { display: none; }
        #boot svg { display: block; }
      }
      @keyframes boot-in { to { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Loading εmul">
