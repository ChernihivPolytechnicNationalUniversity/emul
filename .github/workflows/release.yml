name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Build the image instead of promoting a release candidate. Only for a hotfix branched off main, where no candidate ran on dev."
        type: boolean
        required: false
        default: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
      issues: write
      pull-requests: write
    uses: ChernihivPolytechnicNationalUniversity/shared-actions/.github/workflows/gitops-release.yml@main
    with:
      context: .
      dockerfile: ./Dockerfile
      on-missing-candidate: ${{ inputs.rebuild && 'build' || 'fail' }}
    secrets: inherit
