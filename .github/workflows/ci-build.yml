name: CI Build

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.image.suffix || 'site' }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - { suffix: "", dockerfile: Dockerfile }
          - { suffix: api, dockerfile: backend/api/Dockerfile }
          - { suffix: worker, dockerfile: backend/worker/Dockerfile }
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: ./.github/actions/build-image
        with:
          dockerfile: ${{ matrix.image.dockerfile }}
          suffix: ${{ matrix.image.suffix }}
          push: "false"
          github-token: ${{ secrets.GITHUB_TOKEN }}
